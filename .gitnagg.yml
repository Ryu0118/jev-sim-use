version: 1
resolution: first-match
exit_code: 2

rules:
  - severity: error
    message: Stop. Split this change into smaller commits before continuing.
    when:
      or:
        - metric: added
          gte: 200
        - metric: files
          gte: 6

  - severity: warning
    message: Good checkpoint. Commit before the diff gets harder to review.
    when:
      or:
        - metric: added
          gte: 120
        - metric: files
          gte: 3
