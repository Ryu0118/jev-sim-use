name: Docsync Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docsync:
    name: Docsync Check
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v3

      - name: Check doc sync
        run: mise exec -- docsync check --config docsync.yml
