name: Test

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.swiftformat'
      - '.my-swift-linter.yml'
      - '.swiftlint.yml'
      - '.mise.toml'
      - '.github/workflows/test.yml'
      - 'scripts/e2e.sh'
      - 'scripts/e2e/**'
  pull_request:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.swiftformat'
      - '.my-swift-linter.yml'
      - '.swiftlint.yml'
      - '.mise.toml'
      - '.github/workflows/test.yml'
      - 'scripts/e2e.sh'
      - 'scripts/e2e/**'

concurrency:

  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v3

      - name: SwiftFormat
        run: mise exec -- swiftformat --lint --config .swiftformat .

      - name: SwiftLint
        run: mise exec -- swiftlint lint --config .swiftlint.yml --strict --no-cache

      - name: my-swift-linter
        run: mise exec -- my-swift-linter lint --config .my-swift-linter.yml --no-cache Sources Tests Package.swift

  build-and-test:
    name: Build and Test
    needs: lint
    strategy:
      matrix:
        
        os: [macos-26]
        

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: End-to-end
        run: scripts/e2e.sh

      - name: Keep end-to-end artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: .e2e/
          if-no-files-found: ignore
