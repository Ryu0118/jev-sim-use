# mise is the source of truth for the development toolchain and tasks.
# artifactbundle keeps SwiftPM-backed tools from falling back to a source build.
min_version = "2026.7.5"

[tools]
"spm:nicklockwood/SwiftFormat" = { version = "0.63.0", artifactbundle = true }
"spm:realm/SwiftLint" = { version = "0.65.1", artifactbundle = true }
"spm:Ryu0118/gitnagg" = { version = "0.3.0", artifactbundle = true }
"spm:Ryu0118/my-swift-linter" = { version = "0.14.0", artifactbundle = true }
"spm:Ryu0118/docsync" = { version = "0.3.1", artifactbundle = true }
gitleaks = "8.30.1"

[tasks.setup]
description = "Install tools, bump this project's tools to their latest version, configure Git hooks, format sources, and initialize docsync"
run = [
    "./scripts/mise.sh install",
    "./scripts/mise.sh upgrade --local --bump",
    "./scripts/mise.sh install",
    "./scripts/setup-hooks.sh",
    # Format first so the pre-commit format pass cannot invalidate fresh docsync checksums.
    "./scripts/mise.sh exec -- swiftformat --config .swiftformat .",
    "./scripts/mise.sh exec -- docsync update-checksum --config docsync.yml",
]

[tasks.format]
description = "Format Swift sources with SwiftFormat"
run = "swiftformat --config .swiftformat ."

[tasks.lint]
description = "Lint Swift sources with SwiftLint"
run = "swiftlint lint --config .swiftlint.yml --strict --no-cache"

[tasks.ast-lint]
description = "Lint Swift sources with my-swift-linter"
run = "./scripts/ast-lint.sh"

[tasks.ast-fix]
description = "Auto-fix Swift sources with my-swift-linter"
run = "./scripts/ast-lint.sh --fix"

[tasks.build]
description = "Build the executable package"
run = "swift build"

[tasks.test]
description = "Run the test suite"
run = "swift test"

[tasks.contract-test]
description = "Check the installed sim-use against SimUseContract (needs sim-use and a booted device)"
run = "JEV_SIM_USE_CONTRACT=1 swift test --filter JevSimUseContractTests"

[tasks.e2e]
description = "Run the real-simulator E2E goals (needs a booted simulator's udid and TYPESAFE_API_KEY; not in CI)"
run = "./scripts/e2e-simulator.sh"

[tasks.check]
description = "Format, lint, build, and test"
run = [
    "mise run format",
    "mise run lint",
    "mise run ast-lint",
    "mise run build",
    "mise run test",
    "mise run docsync-check",
]

[tasks.docsync-check]
description = "Check source and documentation checksums"
run = "docsync check --config docsync.yml"

[tasks.update-docsync-checksum]
description = "Update source and documentation checksums"
run = "docsync update-checksum --config docsync.yml"

[tasks.run]
description = "Run the executable"
run = "swift run jev-sim-use"

[tasks.setup-hooks]
description = "Configure Git to use the shared hooks"
run = "./scripts/setup-hooks.sh"
