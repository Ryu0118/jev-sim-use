# SwiftLint configuration for SimJevUse.

excluded:
  - .build
  - .swiftpm
  - "**/.build/**"
  - "**/.swiftpm/**"

included:
  - Sources
  - Tests
  - Package.swift

disabled_rules:
  - trailing_comma
  - opening_brace
  - modifier_order
  - trailing_whitespace
  - vertical_whitespace

line_length:
  warning: 120
  error: 200
  ignores_urls: true

file_length:
  warning: 600
  error: 1000
